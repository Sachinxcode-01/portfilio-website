<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d" />
      <stop offset="50%" stop-color="#080816" />
      <stop offset="100%" stop-color="#030308" />
    </linearGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* TWINKLE STARS */
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.2); }
    }
    .star {
      fill: #00FFE0;
      animation: starTwinkle 3s infinite ease-in-out;
      transform-origin: center;
    }
    .star-2 { animation-delay: 1s; fill: #7c3aed; }
    .star-3 { animation-delay: 2s; fill: #ffffff; }

    /* FLOATING SPHERES */
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-15px) scale(1.05); }
    }
    .orb {
      animation: floatOrb 6s infinite ease-in-out;
      transform-origin: center;
    }
    .orb-slow { animation-duration: 8s; animation-delay: 1.5s; }
    .orb-fast { animation-duration: 4.5s; animation-delay: 0.5s; }

    /* CIRCUIT LINE ANIMATIONS */
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    .circuit-path {
      stroke: rgba(0, 255, 224, 0.2);
      stroke-width: 1.5;
      stroke-dasharray: 8 4;
      animation: dash 5s linear infinite;
    }
    .circuit-path-purple {
      stroke: rgba(124, 58, 237, 0.25);
      animation: dash 7s linear infinite;
    }

    /* NEON TEXT GLOW */
    @keyframes textPulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(0, 255, 224, 0.6)); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(0, 255, 224, 0.9)); }
    }
    .main-title {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      font-size: 54px;
      letter-spacing: 2px;
      animation: textPulse 4s infinite ease-in-out;
    }
    .subtitle {
      font-family: 'monospace';
      font-weight: 600;
      fill: #7c3aed;
      font-size: 18px;
      letter-spacing: 6px;
      opacity: 0.85;
    }

    /* GRID ANIMATION */
    @keyframes gridShift {
      0% { transform: translateY(0); }
      100% { transform: translateY(20px); }
    }
    .grid-bg {
      stroke: rgba(0, 255, 224, 0.03);
      stroke-width: 1;
      animation: gridShift 8s linear infinite;
    }
  </style>

  <!-- Background base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Perspective Grid -->
  <g class="grid-bg">
    <!-- horizontal grid lines -->
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <!-- vertical grid lines -->
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Star Field (Twinkling particles) -->
  <!-- Cyan Stars -->
  <circle cx="150" cy="80" r="2" class="star" />
  <circle cx="850" cy="120" r="1.5" class="star star-2" />
  <circle cx="1050" cy="60" r="2.5" class="star star-3" />
  <circle cx="250" cy="320" r="2" class="star star-2" />
  <circle cx="950" cy="280" r="1.8" class="star" />
  <!-- Purple Stars -->
  <circle cx="350" cy="100" r="2" class="star star-2" />
  <circle cx="720" cy="50" r="2.5" class="star star-3" />
  <circle cx="150" cy="280" r="1.5" class="star star-2" />
  <circle cx="1120" cy="320" r="2.2" class="star" />

  <!-- Network Circuit Lines (flowing dashed pathways) -->
  <path d="M -50 200 Q 300 100 600 200 T 1250 200" fill="none" class="circuit-path" />
  <path d="M -50 100 Q 400 320 800 150 T 1250 300" fill="none" class="circuit-path-purple" />
  <path d="M -50 300 Q 200 50 600 250 T 1250 100" fill="none" class="circuit-path" style="animation-direction: reverse; animation-duration: 4s;" />

  <!-- Floating Glowing Orbs (Skill Clusters) -->
  <!-- Left Side Orbs -->
  <g class="orb orb-slow" style="transform: translate(220px, 120px)">
    <circle r="28" fill="rgba(0, 255, 224, 0.04)" stroke="rgba(0, 255, 224, 0.3)" stroke-width="1.5" filter="url(#glowCyan)" />
    <circle r="8" fill="#00FFE0" />
    <text y="42" font-family="monospace" font-size="12" fill="#00FFE0" text-anchor="middle" font-weight="bold">AI/ML</text>
  </g>

  <g class="orb" style="transform: translate(140px, 260px)">
    <circle r="22" fill="rgba(124, 58, 237, 0.04)" stroke="rgba(124, 58, 237, 0.3)" stroke-width="1.5" filter="url(#glowPurple)" />
    <circle r="6" fill="#7c3aed" />
    <text y="36" font-family="monospace" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="bold">REACT</text>
  </g>

  <!-- Right Side Orbs -->
  <g class="orb orb-fast" style="transform: translate(980px, 150px)">
    <circle r="32" fill="rgba(124, 58, 237, 0.04)" stroke="rgba(124, 58, 237, 0.3)" stroke-width="1.5" filter="url(#glowPurple)" />
    <circle r="8" fill="#7c3aed" />
    <text y="46" font-family="monospace" font-size="12" fill="#c084fc" text-anchor="middle" font-weight="bold">PYTHON</text>
  </g>

  <g class="orb orb-slow" style="transform: translate(1040px, 280px)">
    <circle r="20" fill="rgba(0, 255, 224, 0.04)" stroke="rgba(0, 255, 224, 0.3)" stroke-width="1.5" filter="url(#glowCyan)" />
    <circle r="5" fill="#00FFE0" />
    <text y="34" font-family="monospace" font-size="11" fill="#00FFE0" text-anchor="middle" font-weight="bold">D3.JS</text>
  </g>

  <!-- Centered Branding Content -->
  <g transform="translate(600, 200)">
    <!-- Cyan Glowing Backdrop Circle -->
    <circle r="90" fill="rgba(0, 255, 224, 0.015)" filter="url(#glowCyan)" />
    <!-- Purple Glowing Backdrop Circle -->
    <circle r="120" fill="rgba(124, 58, 237, 0.01)" filter="url(#glowPurple)" />

    <!-- Text Layer -->
    <text class="main-title" text-anchor="middle" y="-10">SACHIN K</text>
    <text class="subtitle" text-anchor="middle" y="40">PORTFOLIO WEBSITE</text>

    <!-- Interactive Glowing Line Under Text -->
    <line x1="-180" y1="62" x2="180" y2="62" stroke="url(#lineGrad)" stroke-width="2" filter="url(#glowCyan)" />
  </g>

  <!-- Line Gradient -->
  <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="rgba(0, 255, 224, 0)" />
    <stop offset="25%" stop-color="rgba(0, 255, 224, 0.8)" />
    <stop offset="50%" stop-color="rgba(124, 58, 237, 0.9)" />
    <stop offset="75%" stop-color="rgba(0, 255, 224, 0.8)" />
    <stop offset="100%" stop-color="rgba(0, 255, 224, 0)" />
  </linearGradient>
</svg>
