<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#18181b"/>
        <stop offset="50%" stop-color="#27272a"/>
        <stop offset="100%" stop-color="#3f3f46"/>
      </linearGradient>
      <radialGradient id="glow" cx="85%" cy="15%" r="65%">
        <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#18181b" stop-opacity="0"/>
      </radialGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      </pattern>
    </defs>
    
    <rect width="1280" height="720" fill="url(#bg)"/>
